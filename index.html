<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picture Puzzle – ¡A resolver el puzzle!</title>
    <meta name="description" content="Juego de puzzle deslizante – Resuelve el rompecabezas para revelar la imagen.">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Open Graph -->
    <meta property="og:title" content="Picture Puzzle">
    <meta property="og:description"
        content="Juego de puzzle deslizante – Resuelve el rompecabezas para revelar la imagen.">
    <meta property="og:url" content="https://borish127.github.io/picture-puzzle/">
    <meta property="og:image" content="https://borish127.github.io/picture-puzzle/pictures/icon.jpg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-blur"></div>

    <h1>A resolver el puzzle</h1>

    <div class="game-container">
        <div id="puzzle-container">
            <div id="preview-image"></div>
            <div class="confetti-container"></div>
        </div>
        <p id="message"></p>
        <p id="countdown-timer" class="hidden"></p>
        <div id="button-container">
            <button id="shuffle-button">Mezclar y Jugar</button>
            <div id="preview-hint" class="hidden">Mantén presionado</div>
            <a href="https://borish127.github.io/picture-puzzle" target="_blank" id="external-link-button"
                class="hidden">
                Visitar Link
            </a>
        </div>
    </div>

    <script src="libs/color-thief.umd.js"></script>
    <script src="script.js"></script>
</body>

</html>
