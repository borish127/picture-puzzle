<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script';">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="text-scale" content="scale">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Picture Puzzle – ¡A resolver el puzzle!</title>
    <meta name="description" content="Juego de puzzle deslizante – Resuelve el rompecabezas para revelar la imagen.">

    <!-- Open Graph -->
    <meta property="og:title" content="Picture Puzzle">
    <meta property="og:description"
        content="Juego de puzzle deslizante – Resuelve el rompecabezas para revelar la imagen.">
    <meta property="og:url" content="https://borish127.github.io/picture-puzzle/">
    <meta property="og:image" content="https://borish127.github.io/picture-puzzle/pictures/icon.jpg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-blur" aria-hidden="true"></div>

    <main class="page-main">
        <h1>A resolver el puzzle</h1>

        <div class="game-container">
            <div id="puzzle-container" role="group" aria-label="Tablero del puzzle 4 por 4">
                <div id="preview-image" aria-hidden="true"></div>
                <div class="confetti-container" aria-hidden="true"></div>
            </div>
            <p id="message" aria-live="polite" aria-atomic="true"></p>
            <p id="countdown-timer" hidden></p>
            <div id="button-container">
                <button type="button" id="shuffle-button">Mezclar y Jugar</button>
                <div id="preview-hint" popover="hint" role="tooltip">Mantén presionado</div>
                <a href="https://borish127.github.io/picture-puzzle" target="_blank" rel="noopener noreferrer"
                    id="external-link-button" hidden>
                    Visitar Link
                </a>
            </div>
        </div>
    </main>

    <script defer src="libs/color-thief.umd.js"></script>
    <script defer src="script.js"></script>
</body>

</html>
